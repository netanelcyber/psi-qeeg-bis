name: Offline research pipeline checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ['3.10', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[ml]'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/verify_example.py

  public-psychiatric-cohort:
    if: github.ref == 'refs/heads/research/run-public-psychiatric-cohort'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project with EDF and ML support
        run: python -m pip install -e '.[edf,ml]'
      - name: Download public cohort, verify provenance, convert and evaluate
        run: python scripts/validate_public_schizophrenia_cohort.py
      - name: Upload evaluation and provenance (not raw EEG)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repod-public-cohort-validation
          path: |
            outputs/repod_schizophrenia/public_cohort_validation.json
            outputs/repod_schizophrenia/group_evaluation.json
            outputs/repod_schizophrenia/held_out_subject_predictions.csv
            outputs/repod_schizophrenia/failures.csv
            data/public_schizophrenia/provenance.json
            data/public_schizophrenia/manifest.csv
          if-no-files-found: warn
          retention-days: 14
