[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "psi-qeeg-bis"
version = "0.1.0"
description = "Research qEEG pipeline for Stern's PSI proposal, emphasizing BIS sensor coverage and real EEG provenance"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Netanel Stern"}]
dependencies = ["numpy>=1.24", "scipy>=1.11", "pandas>=2.0", "matplotlib>=3.7"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.optional-dependencies]
edf = ["mne>=1.6"]
ml = ["scikit-learn>=1.3"]

[project.scripts]
psi-qeeg = "psi_qeeg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

